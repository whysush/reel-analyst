<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reel Analyst</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="container">

    <h1>Reel Analyst</h1>

    <p class="subtitle">
        Analyze the next reels
    </p>

    <div class="grid">

        <button class="count-btn" data-count="1">
            1
        </button>

        <button class="count-btn" data-count="2">
            2
        </button>

        <button class="count-btn" data-count="3">
            3
        </button>

        <button class="count-btn" data-count="5">
            5
        </button>

    </div>

    <button id="startBtn">
        Start Analysis
    </button>

    <p id="selectedText">
        Analyze 1 Reel
    </p>

    <p id="statusText">
        Ready
    </p>

</div>

<script src="popup.js"></script>

</body>
</html>
